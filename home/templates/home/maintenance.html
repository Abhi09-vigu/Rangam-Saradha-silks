<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode - Rangam Saradha Silk Sarees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdf8f8;
            color: #2e2e2e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            color: #AF0446;
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }
        .logo-placeholder {
            font-family: 'Playfair Display', serif;

            color: #AE6F21;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .card-custom {
            background-color: white;
            padding: 4rem 3rem;
            border-radius: 24px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
        }

</head>
<body>
    <div class="card-custom">
        <div class="logo-placeholder">Rangam Saradha Silk</div>
        <h1>We'll Be Back Soon</h1>
        <p class="text-muted fs-5 mb-0">Our online boutique is currently undergoing scheduled maintenance to bring you an improved shopping experience. Please check back shortly.</p>
