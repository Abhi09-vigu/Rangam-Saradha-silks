{% extends 'base.html' %}
{% load static %}

{% block meta_title %}Login - {{ site_settings.website_name }}{% endblock %}

{% block content %}
<section class="section-luxury">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg p-4 p-md-5" style="border-radius: 24px;">
                    <h2 class="font-heading mb-4 text-center">Welcome Back</h2>
                    
                    <form action="{% url 'accounts:login' %}" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label text-muted fs-7">Username or Email Address</label>
                            <input type="text" name="username" class="form-control px-3 py-2" id="username" placeholder="Enter username or email" required>
                        </div>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label text-muted fs-7">Password</label>
                                <a href="{% url 'accounts:forgot_password' %}" class="fs-8 text-primary text-decoration-none">Forgot Password?</a>
                            </div>
                            <input type="password" name="password" class="form-control px-3 py-2" id="password" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2.5 mt-3 rounded-pill text-uppercase fw-semibold fs-7 letter-spacing-1">Login</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted fs-7 mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-primary text-decoration-none fw-semibold">Register Now</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
